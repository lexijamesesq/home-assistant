# Secret scan — the estate's ONLY CI secret scan, and deliberately so.
#
# WHY THIS REPO AND NO OTHER.
# Every other repo is guarded by a local hook line: a staged scan at commit, a
# message scan at commit-msg, and a fail-closed full-range scan at pre-push. That
# line runs BEFORE anything leaves the machine, and it carries the operator's own
# pattern set.
#
# This repo cannot hold it. Its working copy lives in an ephemeral add-on
# container that is rebuilt on every update, so an installed hook does not
# survive; a pin without a mechanism dies on the next rebuild. This workflow is
# the floor that survives that amnesia.
#
# WHAT IT IS NOT.
# It scans with gitleaks' DEFAULT rules only. It cannot carry the operator pattern
# set — that ruleset is private and is deliberately not published, and custom
# patterns are an organisation feature that does not exist on a personal account.
# So this catches provider-shaped credentials and nothing else.
#
# It also runs AFTER the push. For non-rotatable data there is no kill switch:
# once content reaches a public remote it is fetchable, forked, and cached. A
# post-push gate reports a breach; it does not prevent one.
#
# Both limits are why this is an exception for one environment, not a template.
# The workstation relay scan (read the diff over SSH, scan it on the workstation
# with the full operator config, and only then push) remains the REQUIRED step
# that actually protects this repo. Do not read a green check here as coverage.

name: Secret scan
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned and integrity-checked. `sha256sum -c` reads the filename from the
      # checksums line and opens that path, so the download must keep the
      # release's own name.
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          ver=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${ver}"
          tmp="$(mktemp -d)"
          cd "$tmp"
          tarball="gitleaks_${ver}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${ver}_checksums.txt"
          line="$(grep -E "[[:space:]]${tarball}\$" checksums.txt)"
          [ "$(printf '%s\n' "$line" | wc -l)" -eq 1 ]
          printf '%s\n' "$line" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the pull-request commit range
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          range="origin/${BASE_REF}..HEAD"
          # Fail closed on an unresolvable range: gitleaks reports "0 commits
          # scanned" and exits 0 when --log-opts cannot be resolved, so the range
          # is validated here before it is trusted.
          if ! git rev-list --count "$range" >/dev/null 2>&1; then
            echo "::error::cannot resolve the commit range ${range}"
            exit 1
          fi
          echo "commits in range: $(git rev-list --count "$range")"
          gitleaks git . --log-opts="$range" --redact --no-banner --verbose
