name: CI
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Cancel a superseded in-flight run when a PR gets a new push — but NEVER cancel
# a push-to-master run (cancel is gated to pull_request events; on push-to-master
# `cancel-in-progress` is false). On `pull_request`, github.ref is already
# per-PR (refs/pull/<N>/merge), so the group is PR-scoped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shared publication checks plus this repository's YAML syntax appendix.
  floor:
    # The required check is `ci / checks`: this job's name, then the called
    # job's (estate-ci.yml's check_name). Convention `<lane> / <what it checks>`.
    name: ci
    # Read scopes the floor uses with github.token (Jev's triage answer on the
    # head's check-runs). A called workflow gets no more than this; on a
    # private repo the triage read 403s without it and the PR runs the full
    # suite. No write scope, no secret: this is the lane a PR controls.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v1
    with:
      dotty_ref: v1
      check_name: checks

  home-assistant-config:
    name: ci / home-assistant-config
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The live checkout is /config and configuration.yaml deliberately
      # allow-lists /config/json. Mounting the repository at that same path
      # keeps CI faithful to the production path contract. The community
      # action mounts at /github/workspace, so it cannot represent this repo
      # without rewriting production configuration for the test.
      - name: Prepare production-matched Core and Pyscript
        run: docker build --tag ha-config-ci - < tools/ha-ci.Dockerfile

      - name: Test standalone script interfaces
        run: python3 -m unittest discover -s tests

      - name: Check Home Assistant 2026.6.3 configuration
        run: |
          set -euo pipefail
          cp fakesecrets.yaml secrets.yaml
          docker run --rm --network none \
            --entrypoint "" \
            --volume "$GITHUB_WORKSPACE:/config" \
            ha-config-ci \
              sh -ec 'mkdir -p /config/custom_components; cp -r /opt/ci-pyscript /config/custom_components/pyscript; python /config/tools/check-ha-config.py'

  all-checks-passed:
    name: ci / all-passed
    needs: [floor, home-assistant-config]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every dependency to have succeeded (a job skipped on a mechanical PR is satisfied)
        env:
          RESULTS: ${{ toJSON(needs) }}
          MECHANICAL: ${{ needs.floor.outputs.mechanical }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A skipped job is satisfied on a mechanical PR (the floor skipped
          # it) and on any non-PR event (a push to the default branch, where
          # any job skipped by its own `if:` is not a PR's failure); on a
          # functional PR a skipped job is a failure.
          bad="$(jq -r --arg mech "$MECHANICAL" --arg event "$EVENT" '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled"
                     or (.value.result == "skipped" and $mech != "true" and $event == "pull_request"))
            | .key' <<<"$RESULTS")"
          if [[ -n "$bad" ]]; then
            echo "required job(s) not satisfied: $bad"
            exit 1
          fi
          echo "all checks passed (event=${EVENT} mechanical=${MECHANICAL:-false})"
