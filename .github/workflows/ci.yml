name: CI
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A PR's runs group on its ref (refs/pull/<N>/merge), so a new push cancels the
# superseded run. A push to the default branch groups on its own sha and is
# never cancelled: GitHub keeps only one pending run per group, so a shared
# group would silently drop a pending push run -- and with it any job a repo
# adds that must run on every merge, such as a release job.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shared publication checks plus this repository's YAML syntax appendix.
  floor:
    # The required check is `ci / checks`: this job's name, then the called
    # job's (estate-ci.yml's check_name). Convention `<lane> / <what it checks>`.
    name: ci
    # Ceiling only: the reusable's own job declares the narrow scopes it
    # actually needs (contents/pull-requests/checks: read, for Jev's triage
    # answer on the head's check-runs) and a called workflow can never exceed
    # what its caller grants. No write scope, no secret: this is the lane a
    # PR controls.
    permissions: read-all
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v1

  home-assistant-config:
    name: ci / home-assistant-config
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The live checkout is /config and configuration.yaml deliberately
      # allow-lists /config/json. Mounting the repository at that same path
      # keeps CI faithful to the production path contract. The community
      # action mounts at /github/workspace, so it cannot represent this repo
      # without rewriting production configuration for the test.
      - name: Prepare production-matched Core and Pyscript
        run: docker build --tag ha-config-ci - < tools/ha-ci.Dockerfile

      - name: Test standalone script interfaces
        run: python3 -m unittest discover -s tests

      - name: Check Home Assistant 2026.6.3 configuration
        run: |
          set -euo pipefail
          cp fakesecrets.yaml secrets.yaml
          docker run --rm --network none \
            --entrypoint "" \
            --volume "$GITHUB_WORKSPACE:/config" \
            ha-config-ci \
              sh -ec 'mkdir -p /config/custom_components; cp -r /opt/ci-pyscript /config/custom_components/pyscript; python /config/tools/check-ha-config.py'
