name: CI
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

# The reusable uses one PR concurrency group and cancels superseded runs.
jobs:
  checks:
    name: Shared
    uses: lexijamesesq/dotty/.github/workflows/estate-pr-ci.yml@v1
    secrets:
      OPERATOR_RULES: ${{ secrets.OPERATOR_RULES }}
      MARGOT_APP_KEY: ${{ secrets.MARGOT_APP_KEY }}
      MARGOT_JEV_KEY: ${{ secrets.MARGOT_JEV_KEY }}
      MARGOT_ANTHROPIC_TOKEN: ${{ secrets.MARGOT_ANTHROPIC_TOKEN }}

  # Home Assistant's own configuration check needs a production-matched Core
  # container, so it runs here rather than as a local hook.
  home-assistant-config:
    name: Home Assistant Configuration
    needs: checks
    if: needs.checks.outputs.classification != 'mechanical' && needs.checks.outputs.classification != 'documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: home-assistant-config-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Require the classified PR head
        env:
          CLASSIFICATION: ${{ needs.checks.outputs.classification }}
          HEAD_SHA: ${{ needs.checks.outputs.head_sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { CLASSIFICATION, HEAD_SHA, EVENT_HEAD, ACTIONS_CACHE_MODE } = process.env;
            if (CLASSIFICATION !== 'functional' || HEAD_SHA !== EVENT_HEAD ||
                !/^[0-9a-f]{40}$/.test(HEAD_SHA ?? '') ||
                !['read', 'none'].includes(ACTIONS_CACHE_MODE)) {
              core.setFailed('Expected a functional PR, matching authenticated head, and read-only or disabled cache access.');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.head_sha }}
          persist-credentials: false

      # The live checkout is /config and configuration.yaml allow-lists
      # /config/json, so the repository is mounted at that same path.
      - name: Prepare production-matched Core and Pyscript
        run: docker build --tag ha-config-ci - < tools/ha-ci.Dockerfile

      # Two small interface tests, kept beside the configuration check: on a
      # public repository the runner costs nothing and moving them adds nothing.
      - name: Test standalone script interfaces
        run: python3 -m unittest discover -s tests

      - name: Check the Home Assistant configuration
        run: |
          set -euo pipefail
          cp fakesecrets.yaml secrets.yaml
          docker run --rm --network none \
            --entrypoint "" \
            --volume "$GITHUB_WORKSPACE:/config" \
            ha-config-ci \
              sh -ec 'mkdir -p /config/custom_components; cp -r /opt/ci-pyscript /config/custom_components/pyscript; python /config/tools/check-ha-config.py'
