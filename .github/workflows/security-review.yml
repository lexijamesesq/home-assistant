name: Security Review
on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-review:
    # Only run for the authors this review actually covers: humans and the
    # allowed bot (claude-the-enduring). For any other bot (Ollie's dependency
    # bumps, Dependabot) claude-code-action correctly SKIPS its review, but a
    # later internal node24 step exits 1 and fails the whole job. That spurious
    # red check (non-required, but Renovate will not automerge past any red
    # check) permanently blocks bot bumps on this repo. Gating the job to its
    # real review scope removes the false failure with no coverage lost.
    if: ${{ github.event.pull_request.user.type != 'Bot' || github.event.pull_request.user.login == 'claude-the-enduring[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          allowed_bots: claude-the-enduring
          prompt: |
            Review this PR for security concerns: hardcoded credentials,
            injection vulnerabilities, unsafe file operations, PII exposure.
            Focus on the diff only. Be concise.
