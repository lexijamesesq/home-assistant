- id: 9a6811fa31cf40f380abb666e858ba42
  alias: Notify Security - Front Door Locked or Unlocked
  triggers:
  - entity_id: lock.august_web_front_door
    from: locked
    to: unlocked
    trigger: state
  - entity_id: lock.august_web_front_door
    from: unlocked
    to: locked
    trigger: state
  - entity_id:
    - lock.august_web_front_door
    from: unlocking
    to: unlocked
    trigger: state
  - entity_id:
    - lock.august_web_front_door
    from: locking
    to: locked
    trigger: state
  actions:
  - wait_for_trigger:
    - trigger: state
      entity_id: lock.august_web_front_door
      attribute: changed_by
    timeout:
      seconds: 10
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''unlocked'' }}'
      sequence:
      - data:
          title: Condo
          message: '{% set cb = state_attr(''lock.august_web_front_door'',''changed_by'')
            %}{% if cb in [''Manual Lock'',''Manual Unlock''] %}The Front Door was
            manually {{ trigger.to_state.state }}.{% else %}The Front Door was {{
            trigger.to_state.state }} by {{ cb }}.{% endif %}'
