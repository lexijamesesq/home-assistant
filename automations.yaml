          %}{% if cb in [''Manual Lock'',''Manual Unlock''] %}The Front Door was manually
          {{ trigger.to_state.state }}.{% else %}The Front Door was {{ trigger.to_state.state
          }} by {{ cb }}.{% endif %}'
        data:
          url: /dashboard-home/security
          push:
            thread-id: security
            sound: basic-bit-shots.wav
      action: notify.mobile_app_alexis_iphone
