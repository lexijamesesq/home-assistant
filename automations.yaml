- id: aea3b2614a494bf2956e983acefe5900
  alias: Thermostat Eco When Windows Open
  description: Sets thermostats to eco when windows open for 30s, restores when closed.
    Only touches thermostats not already in eco (preserves manual eco).
  triggers:
  - trigger: state
    entity_id: group.all_windows
    from: 'off'
    to: 'on'
    for:
      seconds: 30
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: group.residents
      state: home
    - condition: state
      entity_id: input_boolean.mode_guest
      state: 'on'
  actions:
  - variables:
      set_downstairs: '{{ state_attr(''climate.downstairs'', ''preset_mode'') != ''eco''
        }}'
      set_upstairs: '{{ state_attr(''climate.upstairs'', ''preset_mode'') != ''eco''
        }}'
  - condition: '{{ set_downstairs or set_upstairs }}'
  - if:
    - '{{ set_downstairs }}'
    then:
    - action: climate.set_preset_mode
      target:
        entity_id: climate.downstairs
      data:
        preset_mode: eco
  - if:
    - '{{ set_upstairs }}'
    then:
    - action: climate.set_preset_mode
      target:
        entity_id: climate.upstairs
      data:
        preset_mode: eco
  - wait_for_trigger:
    - trigger: state
      entity_id: group.all_windows
      to: 'off'
  - if:
    - '{{ set_downstairs }}'
    then:
    - action: climate.set_preset_mode
      target:
        entity_id: climate.downstairs
      data:
        preset_mode: none
  - if:
    - '{{ set_upstairs }}'
    then:
    - action: climate.set_preset_mode
      target:
        entity_id: climate.upstairs
      data:
        preset_mode: none
  mode: single
  max_exceeded: silent
- id: 5a0afe3c6b58437f9b514aac1819c5ab
