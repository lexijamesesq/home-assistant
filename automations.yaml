    - arming
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.alarm_tts_source
    data:
      option: none
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.home_alarm
  mode: single
- id: '1781492408800'
  alias: Alarm - Notification Actions
  description: LEX-288 kernel. Actionable buttons from alarm pushes. ALARM_DISARM
    disarms the codeless panel. (ALARM_REARM_AWAY handler removed with the armed_away
    cut.)
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: ALARM_DISARM
    id: disarm
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: disarm
      sequence:
      - action: alarm_control_panel.alarm_disarm
        target:
          entity_id: alarm_control_panel.home_alarm
  mode: queued
  max: 5
- id: '1781492422989'
  alias: Alarm - Pending Response
  description: LEX-288. Entry window (someone opened a perimeter sensor while armed).
    Time-sensitive push with a one-tap Disarm button. (Camera snapshot + breach_camera
    var removed 2026-06-16 — UniFi Protect app is the video source.) Tablet beep/auto-navigate
    added in the tablet step.
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.home_alarm
    to: pending
  actions:
  - action: notify.mobile_app_alexis_iphone
    data:
      title: Condo
      message: Entry detected - {{ state_attr(states('input_text.alarm_last_breach'),
        'friendly_name') or 'perimeter' }}. Disarm?
      data:
        url: /dashboard-home/security
        tag: alarm-event
        push:
          thread-id: security
          interruption-level: time-sensitive
        actions:
        - action: ALARM_DISARM
          title: Disarm
          icon: sfsymbols:shield.slash
  mode: single
  variables: {}
- id: '1781492462128'
  alias: Alarm - Triggered Response
  description: 'LEX-288 kernel. Breach deterrence. Parallelized: critical push + Sonos
    fire instantly (branch 1); branch 2 = security lighting (script.lighting_security_breach,
    per-room calibrated night-ceiling) + Inovelli LED red pulse, FINITE duration 60s
    (self-expires; replaces stuck duration 255). On disarm, alarm_clear_response stops
    this automation so the LED branch cannot re-stomp the clear (atomic teardown).
    mode restart.'
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.home_alarm
    to: triggered
  actions:
  - parallel:
    - sequence:
      - action: notify.mobile_app_alexis_iphone
        data:
          title: SECURITY ALERT
          message: 'Breach: {{ breach_name }}. Alarm triggered.'
          data:
            url: /dashboard-home/security
            tag: alarm-event
            push:
              thread-id: security
              interruption-level: critical
              sound:
                name: siren.wav
                critical: 1
                volume: 1
            actions:
            - action: ALARM_DISARM
              title: Disarm
              icon: sfsymbols:shield.slash
      - action: rest_command.notify_sonos_all
        continue_on_error: true
        data:
          message: Security alert. This home is monitored. Authorities have been notified.
          volume: 40
      - repeat:
          while:
          - condition: state
            entity_id: alarm_control_panel.home_alarm
            state: triggered
          sequence:
          - delay: 00:00:30
          - condition: state
            entity_id: alarm_control_panel.home_alarm
            state: triggered
          - action: notify.mobile_app_alexis_iphone
            data:
              title: SECURITY ALERT
              message: Alarm active - {{ breach_name }} ({{ now().strftime('%-I:%M:%S
                %p') }})
              data:
                tag: alarm-event
                push:
                  thread-id: security
                  interruption-level: active
                actions:
                - action: ALARM_DISARM
                  title: Disarm
                  icon: sfsymbols:shield.slash
    - sequence:
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.lighting_security_breach
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: group.led_strip_effect
        data:
          option: Pulse
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: group.led_strip_effect_color
        data:
          value: 0
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: group.led_strip_effect_duration
        data:
          value: 60
  mode: restart
  variables:
    breach_name: '{{ state_attr(states(''input_text.alarm_last_breach''), ''friendly_name'')
      or ''perimeter'' }}'
- id: '1781492482445'
  alias: Alarm - Clear Response
  description: 'LEX-288 kernel. Fires on disarm from triggered/pending. FIRST stops
    alarm_triggered_response (turn_off stop_actions, then re-enable) so its slow LED
    branch cannot re-stomp this clear (atomic teardown). Then: LED off + duration
    0; all-clear push; from triggered only -> all-lights off then re-apply mode-room
    scripts (transit rooms excluded, self-restore via motion). Parallelized so cleanup
    is not blocked behind the slow LED-off. (armed_away re-arm prompt removed with
    the away cut.)'
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.home_alarm
    to: disarmed
    from: triggered
    id: from_triggered
  - trigger: state
    entity_id: alarm_control_panel.home_alarm
    to: disarmed
    from: pending
    id: from_pending
  actions:
  - action: automation.turn_off
    target:
      entity_id: automation.alarm_triggered_response
    data:
      stop_actions: true
  - action: automation.turn_on
    target:
      entity_id: automation.alarm_triggered_response
  - parallel:
    - sequence:
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: group.led_strip_effect
        data:
          option: 'Off'
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: group.led_strip_effect_duration
        data:
          value: 0
    - sequence:
      - action: notify.mobile_app_alexis_iphone
        data:
          title: Condo
          message: All clear - alarm disarmed.
          data:
            tag: alarm-event
            push:
              thread-id: security
              interruption-level: active
            url: /dashboard-home/security
      - if:
        - condition: trigger
          id: from_triggered
        then:
        - action: light.turn_off
          continue_on_error: true
          target:
            entity_id: group.all_lights
        - delay: 00:00:01
        - action: script.turn_on
          target:
            entity_id:
            - script.lighting_kitchen
            - script.lighting_living_room
            - script.lighting_rec_room_canvas
            - script.lighting_living_room_tv
            - script.lighting_den
            - script.lighting_den_cabinets
            - script.lighting_bedroom
            - script.lighting_patio
            - script.lighting_patio_string_lights
            - script.lighting_studio
  mode: single
- id: '1781496260809'
  alias: Alarm - Perimeter Offline While Armed
  description: LEX-288 kernel. Armed-but-deaf guard. If the perimeter group goes unavailable
    while armed_home (e.g. Konnected board offline), the alarm cannot see breaches.
    Triggers on the group, not the 10 sensors, to avoid a notification flood when
    they all drop together.
  triggers:
  - trigger: state
    entity_id: binary_sensor.perimeter_sensors
    to: unavailable
  conditions:
  - condition: state
    entity_id: alarm_control_panel.home_alarm
    state: armed_home
  actions:
  - action: notify.mobile_app_alexis_iphone
    data:
      title: SECURITY ALERT
      message: Perimeter sensors offline while armed - coverage lost. Check Konnected.
      data:
        url: /dashboard-home/security
        tag: perimeter-offline
        push:
          thread-id: security
          interruption-level: time-sensitive
  mode: single
- id: '1781496323700'
  alias: Alarm - Tablet Wake on Alert
  description: LEX-288. Wakes the wall tablets when the alarm enters pending/triggered
    so the alarm surface is lit (part of the 'house reacting' deterrence). Tablets
    otherwise sleep normally (bedroom hallway stays dark at night). Beep + auto-navigate
    to the Security view are a follow-up pending Fully Kiosk command-signature validation.
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.home_alarm
    to:
    - pending
    - triggered
  actions:
  - action: rest_command.bedroom_hallway_dashboard_wake
    continue_on_error: true
  - action: rest_command.downstairs_hallway_dashboard_wake
    continue_on_error: true
  - action: rest_command.garage_entrance_dashboard_wake
    continue_on_error: true
  mode: single
- id: '1781573311502'
  alias: Alarm - TTS Announcements
  description: 'LEX-288. source=none: armed_home→all-rooms; armed_night→Bedroom only;
    disarmed→delay then scope from from_state (5s+Bedroom for night, 3s+all-rooms
    for home). source=automation→silent. No volume override - speakers play at set
    level. Clears marker to none.'
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.home_alarm
    to:
    - armed_home
    - armed_night
    - disarmed
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ phase == ''armed_home'' and someone_home and source ==
          ''none'' }}'
      sequence:
      - action: rest_command.notify_sonos_all
        data:
          message: Alarm system, armed.
    - conditions:
      - condition: template
        value_template: '{{ phase == ''armed_night'' and source == ''none'' }}'
      sequence:
      - action: rest_command.notify_sonos_room
        data:
          room: Bedroom
          message: Alarm system, armed.
    - conditions:
      - condition: template
        value_template: '{{ phase == ''disarmed'' and source == ''none'' }}'
      sequence:
      - delay:
          seconds: '{{ 5 if from_phase == ''armed_night'' else 3 }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ from_phase == ''armed_night'' }}'
          sequence:
          - action: rest_command.notify_sonos_room
            data:
              room: Bedroom
              message: Alarm system, disarmed.
        default:
        - action: rest_command.notify_sonos_all
          data:
            message: Alarm system, disarmed.
  - if:
    - condition: template
      value_template: '{{ phase in [''armed_home'', ''armed_night'', ''disarmed'']
        }}'
    then:
    - action: input_select.select_option
      target:
        entity_id: input_select.alarm_tts_source
      data:
        option: none
  variables:
    source: '{{ states(''input_select.alarm_tts_source'') }}'
    phase: '{{ trigger.to_state.state }}'
    from_phase: '{{ trigger.from_state.state }}'
    someone_home: '{{ is_state(''group.residents'',''home'') or is_state(''input_boolean.mode_sleep'',''on'')
      }}'
  mode: queued
  max: 10
- id: '1781664733113'
  alias: Alarm - Master Off (kill switch)
  description: 'LEX-288. Master kill switch. input_boolean.alarm_system_enabled ->
    off: disarm the panel + force the LED deterrence off (retried 3x with 2s gaps;
    the Z-Wave LED group fan-out is unreliable and stuck ON for 16 min on 2026-06-16).
    perimeter_breach + auto_arm_home/away are gated on alarm_system_enabled, so OFF
    makes the whole alarm subsystem inert (cannot arm, cannot trigger). Flip back
    on to re-enable.'
  triggers:
  - trigger: state
    entity_id: input_boolean.alarm_system_enabled
    to: 'off'
  actions:
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.home_alarm
  - repeat:
      count: 3
      sequence:
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: group.led_strip_effect
        data:
          option: 'Off'
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: group.led_strip_effect_duration
        data:
          value: 0
      - delay: 00:00:02
  mode: single
- id: '1781744965973'
  alias: Alarm - Garage Actual Opened While Armed
  description: LEX-288 kernel. Garage Actual (Zooz vehicle door) opened while armed_home
    -> immediate companion push with a Close-Garage action, alongside the full breach
    (alarm_perimeter_breach also triggers on binary_sensor.garage_actual ~10s later).
    Keeps CLOSE_GARAGE available on a garage breach without templating the critical
    breach push. from:off avoids a spurious push on unavailable->on after a restart.
  triggers:
  - trigger: state
    entity_id: binary_sensor.garage_actual
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: alarm_control_panel.home_alarm
    state: armed_home
  actions:
  - action: notify.mobile_app_alexis_iphone
    data:
      title: Garage
      message: Garage Actual opened while armed.
      data:
        url: /dashboard-home/security
        tag: garage-armed
        push:
          thread-id: security
          interruption-level: time-sensitive
        actions:
        - action: CLOSE_GARAGE
          title: Close Garage
          icon: sfsymbols:arrow.down.square
  mode: single
