  - data:
      title: Condo
      message: '{% set cb = state_attr(''lock.august_web_garage_door'',''changed_by'')
        %}{% if cb in [''Manual Lock'',''Manual Unlock''] %}The Garage Door was manually
        {{ trigger.to_state.state }}.{% else %}The Garage Door was {{ trigger.to_state.state
        }} by {{ cb }}.{% endif %}'
      data:
