  alias: Bedroom Dimmer Lights Sync
  description: Sync brightness between Bedroom Dimmer (Inovelli VZW31-SN, Smart Bulb
    Mode) and Bedroom Lights (LIFX). Only sets the OTHER entity to prevent Z-Wave
    round-trip echo that causes brightness jumps.
  triggers:
  - id: bedroom_brightness
    trigger: state
    entity_id: light.bedroom
    attribute: brightness
  - id: bedroom_off
    trigger: state
    entity_id: light.bedroom
    to: 'off'
  - id: bedroom_on
    trigger: state
    entity_id: light.bedroom
    to: 'on'
  - id: dimmer_brightness
    trigger: state
    entity_id: light.bedroom_switch
    attribute: brightness
  - id: dimmer_off
    trigger: state
    entity_id: light.bedroom_switch
    to: 'off'
  - id: dimmer_on
    trigger: state
    entity_id: light.bedroom_switch
    to: 'on'
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state.state != ''unavailable'' and trigger.to_state.state
      != ''unavailable'' }}'
  - condition: template
    value_template: '{{ states(''light.bedroom'') != states(''light.bedroom_switch'')
      or (states(''light.bedroom'') == ''on'' and states(''light.bedroom_switch'')
      == ''on'' and ((state_attr(''light.bedroom'', ''brightness'') | int(0)) - (state_attr(''light.bedroom_switch'',
      ''brightness'') | int(0))) | abs > 3) }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - bedroom_brightness
        - bedroom_off
        - bedroom_on
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''light.bedroom'') == ''off'' }}'
        then:
        - action: light.turn_off
          target:
            entity_id: light.bedroom_switch
        else:
        - action: light.turn_on
          target:
            entity_id: light.bedroom_switch
          data:
            brightness: '{{ state_attr(''light.bedroom'', ''brightness'') | int(0)
              }}'
    - conditions:
      - condition: trigger
        id:
        - dimmer_brightness
        - dimmer_off
        - dimmer_on
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''light.bedroom_switch'') == ''off'' }}'
        then:
        - action: light.turn_off
          target:
            entity_id: light.bedroom
        else:
        - action: light.turn_on
          target:
            entity_id: light.bedroom
          data:
            brightness: '{{ state_attr(''light.bedroom_switch'', ''brightness'') |
              int(0) }}'
  mode: restart
