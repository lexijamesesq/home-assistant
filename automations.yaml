- id: '1724791118711'
  alias: Circulate Stale Air
  description: Every 3 hours, run HVAC fans for 10 minutes each (staggered) to circulate
    stale air. Skips fans already running manually. Turn-off is unconditional with
    verify-and-retry to handle intermittent Nest cloud API failures.
  triggers:
  - hours: /3
    minutes: 0
    seconds: 0
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: group.all_windows
    state: 'off'
  actions:
  - variables:
      downstairs_already_on: '{{ state_attr(''climate.downstairs'', ''fan_mode'')
        == ''on'' }}'
      upstairs_already_on: '{{ state_attr(''climate.upstairs'', ''fan_mode'') == ''on''
        }}'
  - if:
    - '{{ not downstairs_already_on }}'
    then:
    - action: climate.set_fan_mode
      target:
        entity_id: climate.downstairs
      data:
        fan_mode: 'on'
    continue_on_error: true
  - delay:
      minutes: 5
  - if:
    - '{{ not upstairs_already_on }}'
    then:
    - action: climate.set_fan_mode
      target:
        entity_id: climate.upstairs
      data:
        fan_mode: 'on'
    continue_on_error: true
  - delay:
      minutes: 5
  - action: climate.set_fan_mode
    target:
      entity_id: climate.downstairs
    data:
      fan_mode: 'off'
    continue_on_error: true
  - delay:
      seconds: 30
  - if:
    - condition: state
      entity_id: climate.downstairs
      attribute: fan_mode
      state: 'on'
    then:
    - action: climate.set_fan_mode
      target:
        entity_id: climate.downstairs
      data:
        fan_mode: 'off'
      continue_on_error: true
    note: Nest cloud API intermittently drops fan-off commands. Verify state after
      30s and retry once if needed.
  - delay:
      minutes: 4
      seconds: 30
  - action: climate.set_fan_mode
    target:
      entity_id: climate.upstairs
    data:
      fan_mode: 'off'
    continue_on_error: true
  - delay:
      seconds: 30
  - if:
    - condition: state
      entity_id: climate.upstairs
      attribute: fan_mode
      state: 'on'
    then:
    - action: climate.set_fan_mode
      target:
        entity_id: climate.upstairs
      data:
        fan_mode: 'off'
      continue_on_error: true
    note: Nest cloud API intermittently drops fan-off commands. Verify state after
      30s and retry once if needed.
  mode: single
  max_exceeded: silent
