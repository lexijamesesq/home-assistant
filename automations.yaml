  description: Alerts when battery-powered devices drop below 40%. Sends push notification
    and creates Things maintenance task.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.august_web_front_door_battery
    - sensor.august_web_garage_door_battery
    - sensor.garage_motion_battery_level
    - sensor.garage_stairs_multisensor_battery_level
    - sensor.downstairs_hallway_trisensor_battery_level
    - sensor.main_stairs_multisensor_battery_level
    - sensor.bedroom_closet_door_battery_level
    - sensor.bedroom_closet_trisensor_battery_level
    - sensor.laundry_door_left_battery_level
    - sensor.laundry_door_right_battery_level
    - sensor.den_multisensor_battery_level
    - sensor.studio_closet_door_battery_level
    below: 40
    for:
      hours: 1
  actions:
  - action: notify.mobile_app_alexis_iphone
    data:
      title: Condo
      message: The {{ trigger.to_state.attributes.friendly_name | replace('Battery
        level', '') | replace('Battery Charge', '') | replace('Battery', '') | trim
        }} battery is at {{ trigger.to_state.state }}%.
      data:
        tag: battery-{{ trigger.entity_id }}
        url: /dashboard-home/health
        push:
          thread-id: system
          sound: gesture.wav
  - action: rest_command.things_add_task
    data:
      title: Replace {{ trigger.to_state.attributes.friendly_name | replace('Battery
        level', '') | replace('Battery Charge', '') | replace('Battery', '') | trim
        }} Battery
      when: Today
      list: Maintenance
  mode: queued
  max: 5
