- id: 0d2af93e5ce84b1a973e633643c17b26
  alias: Sonos - Pause Speakers When HT Mode Starts
  description: Pause the Sonos group when Home Theater mode activates.
  triggers:
  - trigger: state
    entity_id: input_boolean.mode_home_theater
    to: 'on'
  conditions:
  - condition: state
    entity_id: sensor.sonos_group_master_state
    state: playing
  actions:
  - action: media_player.media_pause
    target:
      entity_id: '{{ states(''sensor.sonos_group_master'') }}'
  mode: single
- id: 8cde3eb887224daeabca4ee53890bdb1
  alias: Sonos - Sleep Mode Volume
  description: Reduce bedroom and bathroom volume when sleep mode activates.
  triggers:
  - trigger: state
    entity_id: input_boolean.mode_sleep
    to: 'on'
  actions:
  - action: media_player.volume_set
    target:
      entity_id: media_player.sonos_bedroom
    data:
      volume_level: '{{ (states(''input_number.sonos_bedroom_volume'') | float - offset)
        | round(2, ''floor'') }}'
    continue_on_error: true
  - action: media_player.volume_set
    target:
      entity_id: media_player.sonos_bathroom
    data:
      volume_level: '{{ (states(''input_number.sonos_bathroom_volume'') | float -
        offset) | round(2, ''floor'') }}'
    continue_on_error: true
  variables:
    offset: 0.08
  mode: single
- id: 88c9d5e9e5fb4907a6b437fd69d42d0e
  alias: Set Sonos Group Master Input Select
  trigger:
  - platform: state
    entity_id: sensor.sonos_group_master
  - platform: homeassistant
    event: start
  condition:
  - condition: template
    value_template: '{{ states.sensor.sonos_group_master.state != '''' }}'
  action:
  - data:
      entity_id: input_select.master_sonos
      option: "{% set master = states('sensor.sonos_group_master') %} {% if 'media_player.sonos_kitchen'
        in master %}\n  Kitchen\n{% elif 'media_player.sonos_living_room' in master
        %}\n  Living Room\n{% elif 'media_player.sonos_rec_room_tv' in master %}\n
        \ Rec Room TV\n{% elif 'media_player.sonos_rec_room' in master %}\n  Rec Room\n{%
        elif 'media_player.sonos_bedroom' in master %}\n  Bedroom\n{% elif 'media_player.sonos_bathroom'
        in master %}\n  Bathroom\n{% elif 'media_player.sonos_den' in master %}\n
        \ Den\n{% elif 'media_player.sonos_move' in master %}\n  Move\n{% else %}\n
        \ Unknown\n{% endif %}"
    action: input_select.select_option
