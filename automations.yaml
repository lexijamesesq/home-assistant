  - condition: state
    entity_id: input_boolean.mode_guest
    state: 'off'
  - condition: state
    entity_id: input_boolean.virtual_lexi
    state: 'off'
  - condition: state
    entity_id: input_select.time_of_day_mode
    state:
    - Sunset
    - Night
