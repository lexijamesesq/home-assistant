- id: 2e470db960fa421686c0904a91894653
  alias: Downstairs Patio Dimmer Lights Sync
  description: Sync brightness between Downstairs Patio Dimmer (Inovelli VZW31-SN,
    Smart Bulb Mode) and Downstairs Patio Lights (LIFX). Only sets the OTHER entity
    to prevent Z-Wave round-trip echo.
  triggers:
  - id: patio_brightness
    trigger: state
    entity_id: light.downstairs_patio
    attribute: brightness
  - id: patio_off
    trigger: state
    entity_id: light.downstairs_patio
    to: 'off'
  - id: patio_on
    trigger: state
    entity_id: light.downstairs_patio
    to: 'on'
  - id: dimmer_brightness
    trigger: state
    entity_id: light.downstairs_patio_dimmer
    attribute: brightness
  - id: dimmer_off
    trigger: state
    entity_id: light.downstairs_patio_dimmer
    to: 'off'
  - id: dimmer_on
    trigger: state
    entity_id: light.downstairs_patio_dimmer
    to: 'on'
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state.state != ''unavailable'' and trigger.to_state.state
      != ''unavailable'' }}'
  - condition: template
    value_template: '{{ states(''light.downstairs_patio'') != states(''light.downstairs_patio_dimmer'')
      or (states(''light.downstairs_patio'') == ''on'' and states(''light.downstairs_patio_dimmer'')
      == ''on'' and ((state_attr(''light.downstairs_patio'', ''brightness'') | int(0))
      - (state_attr(''light.downstairs_patio_dimmer'', ''brightness'') | int(0)))
      | abs > 3) }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - patio_brightness
        - patio_off
        - patio_on
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''light.downstairs_patio'') == ''off'' }}'
        then:
        - action: light.turn_off
          target:
            entity_id: light.downstairs_patio_dimmer
        else:
        - action: light.turn_on
          target:
            entity_id: light.downstairs_patio_dimmer
          data:
            brightness: '{{ state_attr(''light.downstairs_patio'', ''brightness'')
              | int(0) }}'
    - conditions:
      - condition: trigger
        id:
        - dimmer_brightness
        - dimmer_off
        - dimmer_on
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''light.downstairs_patio_dimmer'') == ''off''
            }}'
        then:
        - action: light.turn_off
          target:
            entity_id: light.downstairs_patio
        else:
        - action: light.turn_on
          target:
            entity_id: light.downstairs_patio
          data:
            brightness: '{{ state_attr(''light.downstairs_patio_dimmer'', ''brightness'')
              | int(0) }}'
  mode: restart
