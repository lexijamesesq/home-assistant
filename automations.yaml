- id: '1781488978783'
  alias: Alarm - Perimeter Breach
  description: LEX-288 kernel. When armed_home or armed_night, any perimeter door/window
    OR Garage Actual opening fires alarm_trigger. Panel delay_time = entry window
    before triggered. Records breached entity in input_text.alarm_last_breach for
    the triggered-response message. from:off avoids spurious fires on unavailable->on
    after restart/reconnect. queued so simultaneous openings serialize.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.front_door
    - binary_sensor.garage_door
    - binary_sensor.kitchen_windows
    - binary_sensor.living_room_windows
    - binary_sensor.rec_room_windows
    - binary_sensor.bedroom_windows
    - binary_sensor.den_windows
    - binary_sensor.studio_windows
    - binary_sensor.patio_door
    - binary_sensor.den_door
    - binary_sensor.garage_actual
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: alarm_control_panel.home_alarm
    state:
    - armed_home
    - armed_night
  - condition: state
    entity_id: input_boolean.alarm_system_enabled
    state: 'on'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.alarm_last_breach
    data:
      value: '{{ trigger.entity_id }}'
  - action: alarm_control_panel.alarm_trigger
    target:
      entity_id: alarm_control_panel.home_alarm
  mode: queued
  max: 10
- id: '1781489099578'
  alias: Alarm - Auto-Arm Sleep
  description: LEX-288 kernel. mode_sleep on (while disarmed + alarm enabled) -> arm
    panel armed_night. Codeless panel.
  triggers:
  - trigger: state
    entity_id: input_boolean.mode_sleep
    to: 'on'
  conditions:
  - condition: state
    entity_id: alarm_control_panel.home_alarm
    state: disarmed
  - condition: state
    entity_id: input_boolean.alarm_system_enabled
    state: 'on'
  actions:
  - action: alarm_control_panel.alarm_arm_night
    target:
      entity_id: alarm_control_panel.home_alarm
  mode: single
- id: '1781492170340'
  alias: Alarm - Disarm on Wake
  description: LEX-288. mode_sleep off disarms from armed_home, armed_night, or arming.
    Codeless panel - no code passed.
  triggers:
  - trigger: state
    entity_id: input_boolean.mode_sleep
    to: 'off'
  conditions:
