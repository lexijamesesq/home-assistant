# Correctness rules shared with the existing Ruff 0.16.10 consumer pin.
# Ruff format owns Python layout; selected bugbear rules were trialled on source.
[lint]
select = ["E4", "E7", "E9", "F", "B006", "B018", "B023"]

# pyscript injects names such as `service`, `state_trigger` and `log` into its
# scripts at runtime, so they are undefined to a static reader.
[lint.per-file-ignores]
"pyscript/**" = ["F821"]
